<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<style>
		/* 勤怠テーブル */
		.attendance-table {
			width: 100%;
		}

		.attendance-table table {
			margin-bottom: 0;
		}

		/* ヘッダーは固定 */
		.attendance-table thead {
			display: block;
		}

		/* 明細部分だけスクロール */
		.attendance-table tbody {
			display: block;
			overflow-y: scroll;
			height: 560px;
		}
	</style>

	<!-- 定時ボタン用JavaScript -->
	<script>
		function setRegularTime(button) {
			// 定時ボタンが押された行を取得
			const row = button.closest('tr');

			// その行にあるselectを取得
			const selects = row.querySelectorAll('select');

			// 出勤 09:00
			selects[0].value = '9';
			selects[1].value = '0';

			// 退勤 18:00
			selects[2].value = '18';
			selects[3].value = '0';
		}
	</script>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>
			勤怠管理
			<small>( [[${attendanceForm.userName}]] )</small>
		</h2>

		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2>
				<small>途中退校日：[[${attendanceForm.dispLeaveDate}]]</small>
			</h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">
			<form th:action="@{/attendance/update}" method="post" th:object="${attendanceForm}">

				<!-- 入力エラー表示 -->
				<div th:if="${inputErrors != null and !inputErrors.isEmpty()}" class="alert alert-danger">
					<ul>
						<li th:each="error : ${inputErrors}" th:text="${error.defaultMessage}"></li>
					</ul>
				</div>

				<div class="attendance-table">

					<table class="table table-hover dataTable no-footer">

						<thead>
							<tr>
								<th class="w140">日付</th>
								<th class="w140">コース内容</th>
								<th class="w60">定時</th>
								<th class="w180" colspan="3">出勤</th>
								<th class="w180" colspan="3">退勤</th>
								<th class="w80">中抜け時間</th>
								<th class="w70">ステータス</th>
								<th class="w140">備考</th>
							</tr>
						</thead>

						<tbody>

							<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">

								<tr>

									<!-- hidden -->
									<th:block>
										<input type="hidden"
											th:field="*{attendanceList[__${stat.index}__].isToday}" />

										<input type="hidden"
											th:field="*{attendanceList[__${stat.index}__].studentAttendanceId}" />

										<input type="hidden"
											th:field="*{attendanceList[__${stat.index}__].trainingDate}" />

										<input type="hidden"
											th:field="*{attendanceList[__${stat.index}__].dispTrainingDate}" />

										<input type="hidden"
											th:field="*{attendanceList[__${stat.index}__].sectionName}" />

										<input type="hidden"
											th:field="*{attendanceList[__${stat.index}__].statusDispName}" />
									</th:block>

									<!-- 日付 -->
									<td class="w140">
										[[${dailyAttendanceForm.dispTrainingDate}]]
									</td>

									<!-- コース内容 -->
									<td class="w140">
										[[${dailyAttendanceForm.sectionName}]]
									</td>

									<!-- 定時ボタン -->
									<td class="w60">
										<input
											type="button"
											class="btn btn-success default-button"
											value="定時"
											onclick="setRegularTime(this)" />
									</td>

									<!-- 出勤時間（時） -->
									<td class="w70">
										<select
											th:field="*{attendanceList[__${stat.index}__].trainingStartTimeHour}"
											class="form-control">

											<option
												th:each="hour : ${attendanceForm.hours}"
												th:value="${hour.key}"
												th:text="${hour.value}">
											</option>

										</select>
									</td>

									<td>
										:
									</td>

									<!-- 出勤時間（分） -->
									<td class="w70">
										<select
											th:field="*{attendanceList[__${stat.index}__].trainingStartTimeMinute}"
											class="form-control">

											<option
												th:each="minute : ${attendanceForm.minutes}"
												th:value="${minute.key}"
												th:text="${minute.value}">
											</option>

										</select>
									</td>

									<!-- 退勤時間（時） -->
									<td class="w70">
										<select
											th:field="*{attendanceList[__${stat.index}__].trainingEndTimeHour}"
											class="form-control">

											<option
												th:each="hour : ${attendanceForm.hours}"
												th:value="${hour.key}"
												th:text="${hour.value}">
											</option>

										</select>
									</td>

									<td>
										:
									</td>

									<!-- 退勤時間（分） -->
									<td class="w70">
										<select
											th:field="*{attendanceList[__${stat.index}__].trainingEndTimeMinute}"
											class="form-control">

											<option
												th:each="minute : ${attendanceForm.minutes}"
												th:value="${minute.key}"
												th:text="${minute.value}">
											</option>

										</select>
									</td>

									<!-- 中抜け時間 -->
									<td class="w80">
										<select
											th:field="*{attendanceList[__${stat.index}__].blankTime}"
											class="form-control">

											<option
												th:each="blankTime : ${attendanceForm.blankTimes}"
												th:value="${blankTime.key}"
												th:text="${blankTime.value}">
											</option>

										</select>
									</td>

									<!-- ステータス -->
									<td class="w70">
										[[${dailyAttendanceForm.statusDispName}]]
									</td>

									<!-- 備考 -->
									<td class="w140">
										<input
											type="text"
											th:field="*{attendanceList[__${stat.index}__].note}"
											class="form-control">
									</td>

								</tr>

							</th:block>

						</tbody>

					</table>

				</div>

				<!-- ボタン -->
				<div class="form-group">

					<th:block th:if="${session.loginUserDto.role == '0001'}">

						<a
							th:href="@{/attendance/detail}"
							class="btn btn-default">
							戻る
						</a>

					</th:block>

					<th:block th:if="${session.loginUserDto.role != '0001'}">

						<input
							type="submit"
							value="戻る"
							name="indexCompany"
							class="btn btn-default" />

					</th:block>

					<input
						type="submit"
						value="更新"
						name="complete"
						class="btn btn-info"
						onclick="return confirm('更新します。よろしいですか？');" />

				</div>

			</form>
		</div>
	</div>

</body>

</html>
